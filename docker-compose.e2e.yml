services:
  untp-playground:
    image: untp-playground:e2e
    profiles: ['playground']
    build:
      context: .
      dockerfile: packages/untp-playground/Dockerfile
      cache_from:
        - type=gha,scope=untp-playground-e2e
      cache_to:
        - type=gha,scope=untp-playground-e2e,mode=max
    ports:
      - '4000:3000'
    volumes:
      - ./packages/untp-playground:/untp-playground
      - /untp-playground/node_modules
    environment:
      - NODE_ENV=development
      - VERIFICATION_SERVICE_URL=http://vckit-api:3332/agent/routeVerificationCredential
      - VERIFICATION_SERVICE_TOKEN=test123

  vckit-api:
    image: ghcr.io/uncefact/project-vckit:sha-325b7e3@sha256:3623cd45cdb971ba16c6016a1e3ba153fe6920c2053275cd430e76ab75d5a563
    profiles: ['ri', 'playground']
    env_file:
      - local.env
    ports:
      - 3332:3332
    depends_on:
      - db
    healthcheck:
      test: ['CMD-SHELL', 'wget --quiet --spider http://localhost:3332/agent-api-docs || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  db:
    image: postgres:16-alpine
    profiles: ['ri', 'playground']
    ports:
      - 5432:5432
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=vckit
    volumes:
      - vckit-data:/var/lib/postgresql/data
    restart: always

  storage-service:
    image: ghcr.io/uncefact/project-storage-service:4.0.0
    profiles: ['ri']
    ports:
      - 3334:3334
    environment:
      - PROTOCOL=http
      - DOMAIN=localhost
      - PORT=3334
      - AVAILABLE_BUCKETS=${UNCEFACT_STORAGE_PUBLIC_BUCKET:-public-data},${UNCEFACT_STORAGE_PRIVATE_BUCKET:-private-data}
      - DEFAULT_BUCKET=${UNCEFACT_STORAGE_PUBLIC_BUCKET:-public-data}
      - STORAGE_TYPE=local
      - API_KEY=${UNCEFACT_STORAGE_API_KEY:-test123}
      - ALLOWED_UPLOAD_TYPES=image/png,image/jpeg,image/webp,application/pdf,text/html

  identity-resolver-service:
    image: ghcr.io/pyx-industries/pyx-identity-resolver:4.0.0
    profiles: ['ri']
    ports:
      - '3000:3000'
    environment:
      - OBJECT_STORAGE_ENDPOINT=identity-resolver-service-object-store
      - OBJECT_STORAGE_PORT=9000
      - OBJECT_STORAGE_USE_SSL=false
      - OBJECT_STORAGE_ACCESS_KEY=minioadmin
      - OBJECT_STORAGE_SECRET_KEY=minioadmin
      - OBJECT_STORAGE_BUCKET_NAME=idr-bucket-1
      - OBJECT_STORAGE_PATH_STYLE=true
      - IDENTIFIER_PATH=identifiers
      - API_KEY=test123
      - APP_ENDPOINT=http://localhost:3000
      - APP_NAME=IDR-1
      - RESOLVER_DOMAIN=http://localhost:3000/api/v4
      - LINK_TYPE_VOC_DOMAIN=http://localhost:3000/api/v4/voc
      - PORT=3000
    depends_on:
      - identity-resolver-service-object-store

  identity-resolver-service-object-store:
    image: quay.io/minio/minio:RELEASE.2024-08-17T01-24-54Z-cpuv1
    profiles: ['ri']
    command: server /data --console-address ":9090"
    ports:
      - '9000:9000'
      - '9090:9090'
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - ./minio_data/identity-resolver-service-object-store/data-test:/data

  app:
    image: app:e2e
    profiles: ['ri']
    build:
      context: .
      dockerfile: packages/reference-implementation/Dockerfile
      target: development
      cache_from:
        - type=gha,scope=reference-implementation-e2e
      cache_to:
        - type=gha,scope=reference-implementation-e2e,mode=max
    ports:
      - '3003:3003'
    environment:
      - RI_POSTGRES_USER=ri-postgres
      - RI_POSTGRES_PASSWORD=ri-postgres
      - RI_POSTGRES_DB=ri
      - RI_POSTGRES_HOST=e2e-ri-db
      - RI_POSTGRES_PORT=5432
      - RI_DATABASE_URL=postgresql://ri-postgres:ri-postgres@e2e-ri-db:5432/ri?schema=public
      - RI_APP_URL=http://localhost:3003
      - DEFAULT_HUMAN_VERIFICATION_URL=http://localhost:3003/verify
      - DEFAULT_MACHINE_VERIFICATION_URL=http://vckit-api:3332/agent/routeVerificationCredential
      - VCKIT_API_URL=http://vckit-api:3332/v2
      - VCKIT_API_KEY=test123
      - DATA_ENCRYPTION_KEY=dd1b7430915155b51c503806031f31f901e85563035f65421d707f042c75f44b
      - AUTH_SECRET=e2e-super-secret-key-for-testing
      - AUTH_TRUST_HOST=true
      - AUTH_URL=http://localhost:3003
      - AUTH_OIDC_PROVIDER=keycloak
      - AUTH_OIDC_CLIENT_ID=ri-app-e2e
      - AUTH_OIDC_CLIENT_SECRET=e2e-test-secret
      - AUTH_OIDC_ISSUER=http://localhost:8081/realms/ri-e2e
      - AUTH_OIDC_SERVICE_ACCOUNT_AUDIENCE=ri-api
      - UNCEFACT_STORAGE_URL=http://storage-service:3334/api/v4/public
      - UNCEFACT_STORAGE_API_KEY=test123
      - UNCEFACT_STORAGE_PUBLIC_BUCKET=${UNCEFACT_STORAGE_PUBLIC_BUCKET:-public-data}
      - UNCEFACT_STORAGE_PRIVATE_BUCKET=${UNCEFACT_STORAGE_PRIVATE_BUCKET:-private-data}
      - PYX_IDR_API_URL=http://identity-resolver-service:3000
      - PYX_IDR_API_KEY=test123
      - VERIFY_ALLOW_PRIVATE_URLS=true
      # Tenant mode (default: open — override to "closed" for closed mode tests)
      - TENANT_MODE=${TENANT_MODE:-open}
      - TENANT_CLAIM_NAME=${TENANT_CLAIM_NAME:-groups}
      - TENANT_CLAIM_FORMAT=${TENANT_CLAIM_FORMAT:-array_first}
      # System default service instances (used by seed.ts)
      - SYSTEM_VC_BASE_URL=http://vckit-api:3332
      - SYSTEM_VC_API_KEY=test123
      - SYSTEM_VC_ADAPTER_TYPE=VCKIT
      - SYSTEM_VC_API_VERSION=1.0.0
      - SYSTEM_STORAGE_BASE_URL=http://storage-service:3334
      - SYSTEM_STORAGE_API_KEY=test123
      - SYSTEM_STORAGE_ADAPTER_TYPE=UNCEFACT_STORAGE
      - SYSTEM_STORAGE_API_VERSION=4.0
      - SYSTEM_STORAGE_PUBLIC_BUCKET=public-data
      - SYSTEM_STORAGE_PRIVATE_BUCKET=private-data
      - SYSTEM_IDR_BASE_URL=http://identity-resolver-service:3000
      - SYSTEM_IDR_API_KEY=test123
      - SYSTEM_IDR_ADAPTER_TYPE=PYX_IDR
      - SYSTEM_IDR_API_VERSION=4.0
      - SYSTEM_IDR_DEFAULT_LINK_TYPE=untp:dpp
      - SYSTEM_IDR_DEFAULT_MIME_TYPE=text/html
      - SYSTEM_IDR_DEFAULT_LANGUAGE=en
      - SYSTEM_IDR_DEFAULT_CONTEXT=au
      - SYSTEM_IDR_DEFAULT_FWQS=true
      - SYSTEM_DID=did:web:uncefact.github.io:project-vckit:test-and-development
      - SYSTEM_DID_NAME=System Default DID
      - SYSTEM_DID_DESCRIPTION=System-wide default DID for E2E testing
    volumes:
      - ./examples/seed:/app/seed/custom:ro
    extra_hosts:
      - 'localhost:host-gateway'
    depends_on:
      vckit-api:
        condition: service_healthy
      storage-service:
        condition: service_started
      e2e-keycloak:
        condition: service_healthy
      e2e-ri-db:
        condition: service_healthy

  e2e-ri-db:
    image: postgres:17-alpine
    profiles: ['ri']
    ports:
      - 5433:5432
    environment:
      - POSTGRES_USER=ri-postgres
      - POSTGRES_PASSWORD=ri-postgres
      - POSTGRES_DB=ri
    volumes:
      - e2e-ri-db-data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ri-postgres -d ri']
      interval: 10s
      timeout: 5s
      retries: 5

  e2e-keycloak:
    image: quay.io/keycloak/keycloak:26.7
    profiles: ['ri']
    command:
      - start-dev
      - --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: 'true'
    ports:
      - '8081:8080'
      - '9991:9000'
    volumes:
      - ./packages/reference-implementation/e2e/cypress/fixtures/keycloak-realm-e2e.json:/opt/keycloak/data/import/ri-e2e.json:ro
    healthcheck:
      test:
        - CMD-SHELL
        - |
          set -e
          exec 3<>/dev/tcp/127.0.0.1/9000
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3
          grep -q '^HTTP/1\.1 200' <&3
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

volumes:
  vckit-data:
  e2e-ri-db-data:
