name: Build and Test

on:
  # Trigger on every pull request regardless of base branch. Stacked PRs
  # (which target an in-flight feature branch instead of `next`) need CI
  # too; the previous `branches: [next]` filter skipped them silently.
  pull_request: {}
  # Running on push to `next` (post-merge) is intentional: it lets the
  # `quality` job populate the `node_modules` cache from `refs/heads/next`,
  # which subsequent PRs can then restore from. GitHub Actions caches
  # written from a PR ref are scoped to that PR; only caches written from
  # the base branch are shared across PRs targeting it.
  push:
    branches:
      - next

# Default permissions: read-only access to repo contents. Individual jobs can
# request additional permissions if they need to write (none currently do).
permissions:
  contents: read

concurrency:
  # PRs key on the PR number so updating a PR cancels its in-flight run.
  # Push events on `next` key on the branch ref so back-to-back merges
  # supersede each other (older runs are cancelled in favour of the latest).
  group: ${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || format('push-{0}', github.ref) }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Enable Corepack
        run: corepack enable

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Restore node_modules cache
        id: cache-modules
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
            ~/.cache/Cypress
          key: node-modules-v3-${{ runner.os }}-${{ hashFiles('yarn.lock') }}

      - name: Install dependencies
        if: steps.cache-modules.outputs.cache-hit != 'true'
        run: yarn install --frozen-lockfile

      - name: Save node_modules cache
        if: steps.cache-modules.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
            ~/.cache/Cypress
          key: node-modules-v3-${{ runner.os }}-${{ hashFiles('yarn.lock') }}

      - name: Check formatting
        run: yarn format:check

      - name: Check linting
        run: yarn lint:check

  qa:
    name: QA (${{ matrix.package }})
    runs-on: ubuntu-latest
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        # untp-test-suite-mocha is deliberately omitted: it has no test script
        # and runs heavy Mocha conformance tests, not unit tests. See ADR 006
        # adoption notes.
        package:
          - '@uncefact/untp-ri-services'
          - '@reference-implementation/components'
          - '@reference-implementation/core'
          - 'untp-playground'
          - '@uncefact/untp-utils'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Enable Corepack
        run: corepack enable

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      # `quality` is the upstream installer (`needs: quality`), so this restore
      # should hit. The fallback install handles rare cache misses (e.g. cache
      # eviction) without failing the job.
      - name: Restore node_modules cache
        id: cache-modules
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
            ~/.cache/Cypress
          key: node-modules-v3-${{ runner.os }}-${{ hashFiles('yarn.lock') }}

      - name: Install dependencies (fallback if cache restore missed)
        if: steps.cache-modules.outputs.cache-hit != 'true'
        run: yarn install --frozen-lockfile

      - name: Build ${{ matrix.package }} (and affected deps)
        run: yarn turbo run build --filter='${{ matrix.package }}...[origin/next]'

      # `--changedSince=origin/next` is passed through to jest so file-level
      # affected filtering still applies inside each package, matching the
      # scope of the previous `lerna exec -- yarn jest --changedSince` step.
      # Calls turbo's binary directly because `yarn turbo` consumes the `--`
      # separator before it reaches turbo.
      - name: Test ${{ matrix.package }} (changed files only)
        run: ./node_modules/.bin/turbo run test --filter='${{ matrix.package }}...[origin/next]' -- --changedSince=origin/next

  build-e2e-images:
    name: Build E2E images
    runs-on: ubuntu-latest
    needs: [quality, qa]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Enable Corepack
        run: corepack enable

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Restore node_modules cache
        id: cache-modules
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
            ~/.cache/Cypress
          key: node-modules-v3-${{ runner.os }}-${{ hashFiles('yarn.lock') }}

      - name: Install dependencies (fallback if cache restore missed)
        if: steps.cache-modules.outputs.cache-hit != 'true'
        run: yarn install --frozen-lockfile

      - name: Check which E2E images need building
        id: affected
        shell: bash
        run: |
          set -euo pipefail

          # Helper: capture turbo dry-run output, fail loudly if turbo errored
          # or jq cannot parse the task count. Matches the validation pattern
          # used in the per-app `e2e-ri` / `e2e-playground` affected steps.
          turbo_task_count() {
            local filter="$1"
            local json
            json=$(yarn --silent turbo run build --filter="$filter" --dry-run=json)
            if [ -z "$json" ]; then
              echo "::error::turbo dry-run produced empty output for filter $filter"
              exit 1
            fi
            local count
            count=$(echo "$json" | jq '.tasks | length')
            if ! [[ "$count" =~ ^[0-9]+$ ]]; then
              echo "::error::Could not parse turbo task count for filter $filter: '$count'"
              echo "--- Raw output ---"
              echo "$json"
              exit 1
            fi
            echo "$count"
          }

          ri_count=$(turbo_task_count '@reference-implementation/core...[origin/next]')
          playground_count=$(turbo_task_count 'untp-playground...[origin/next]')

          # E2E-only artefact changes — split per app so each image build is gated independently.
          # Workflow / shared compose changes invalidate both (conservative; they could affect either).
          # Note: changes to `.github/workflows/build_test.yml` count as `shared_extra`, so any workflow
          # edit forces a rebuild of both images even when the workflow logic itself does not change image contents.
          ri_extra=$(git diff --name-only origin/next...HEAD -- \
            'packages/reference-implementation/e2e/**' \
            | wc -l | tr -d ' ')
          playground_extra=$(git diff --name-only origin/next...HEAD -- \
            'packages/untp-playground/e2e/**' \
            | wc -l | tr -d ' ')
          shared_extra=$(git diff --name-only origin/next...HEAD -- \
            'docker-compose.e2e.yml' \
            'docker-compose.e2e-closed.yml' \
            '.github/workflows/build_test.yml' \
            | wc -l | tr -d ' ')

          ri_build=false
          playground_build=false
          if [ "$ri_count" -gt 0 ] || [ "$ri_extra" -gt 0 ] || [ "$shared_extra" -gt 0 ]; then
            ri_build=true
          fi
          if [ "$playground_count" -gt 0 ] || [ "$playground_extra" -gt 0 ] || [ "$shared_extra" -gt 0 ]; then
            playground_build=true
          fi

          echo "ri=$ri_build" >> "$GITHUB_OUTPUT"
          echo "playground=$playground_build" >> "$GITHUB_OUTPUT"
          echo "Build plan: ri=$ri_build playground=$playground_build (ri_count=$ri_count playground_count=$playground_count ri_extra=$ri_extra playground_extra=$playground_extra shared_extra=$shared_extra)"

      - name: Set up Docker Buildx
        if: steps.affected.outputs.ri == 'true' || steps.affected.outputs.playground == 'true'
        uses: docker/setup-buildx-action@v3

      # Builds the affected image(s) via buildx's GHA cache backend
      # (`cache_to: type=gha,mode=max` is configured per service in
      # `docker-compose.e2e.yml`). Downstream E2E jobs pull from the same
      # cache scope and skip the actual build work on a cache hit.
      - name: Build RI image
        if: steps.affected.outputs.ri == 'true'
        run: docker compose -f docker-compose.e2e.yml --profile ri build

      - name: Build playground image
        if: steps.affected.outputs.playground == 'true'
        run: docker compose -f docker-compose.e2e.yml --profile playground build

  e2e-ri:
    name: E2E RI (${{ matrix.mode }})
    runs-on: ubuntu-latest
    needs: [quality, qa, build-e2e-images]
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: open
            compose-override: ''
          - mode: closed
            compose-override: '-f docker-compose.e2e-closed.yml'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Enable Corepack
        run: corepack enable

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Restore node_modules cache
        id: cache-modules
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
            ~/.cache/Cypress
          key: node-modules-v3-${{ runner.os }}-${{ hashFiles('yarn.lock') }}

      - name: Install dependencies (fallback if cache restore missed)
        if: steps.cache-modules.outputs.cache-hit != 'true'
        run: yarn install --frozen-lockfile

      - name: Check whether E2E should run
        id: affected
        shell: bash
        run: |
          set -euo pipefail

          affected_json=$(yarn --silent turbo run build --filter='@reference-implementation/core...[origin/next]' --dry-run=json)
          if [ -z "$affected_json" ]; then
            echo "::error::turbo dry-run produced empty output"
            exit 1
          fi
          task_count=$(echo "$affected_json" | jq '.tasks | length')
          if ! [[ "$task_count" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not parse turbo task count: '$task_count'"
            echo "--- Raw output ---"
            echo "$affected_json"
            exit 1
          fi

          extra_changed=$(git diff --name-only origin/next...HEAD -- \
            'packages/reference-implementation/e2e/**' \
            'docker-compose.e2e.yml' \
            'docker-compose.e2e-closed.yml' \
            '.github/workflows/build_test.yml' \
            | wc -l | tr -d ' ')

          if [ "$task_count" -gt 0 ] || [ "$extra_changed" -gt 0 ]; then
            echo "result=true" >> "$GITHUB_OUTPUT"
            echo "RI E2E (${{ matrix.mode }}) will run. turbo task_count=$task_count, extra_changed=$extra_changed."
          else
            echo "result=false" >> "$GITHUB_OUTPUT"
            echo "RI E2E (${{ matrix.mode }}) skipped. Reference-implementation dep graph unaffected and no RI e2e/compose/workflow files changed."
          fi

      # https://github.com/actions/runner-images/issues/2840#issuecomment-1284059930
      # https://github.com/uncefact/tests-untp/issues/344
      - name: Free up space on ubuntu runner for E2E tests
        if: steps.affected.outputs.result == 'true'
        run: |
          sudo rm -rf \
            "$AGENT_TOOLSDIRECTORY" \
            /opt/microsoft \
            /opt/pipx \
            /usr/local/.ghcup \
            /usr/local/graalvm* \
            /usr/local/julia* \
            /usr/local/lib/android \
            /usr/local/share/chromium \
            /usr/local/share/powershell \
            /usr/local/share/vcpkg \
            /usr/share/dotnet \
            /usr/share/miniconda \
            /usr/share/swift
          docker image prune -af

      - name: Set up Docker Buildx
        if: steps.affected.outputs.result == 'true'
        uses: docker/setup-buildx-action@v3

      # Re-runs `docker compose build` for the RI image. The buildx GHA cache
      # populated by `build-e2e-images` (`cache_from: type=gha,...` in
      # `docker-compose.e2e.yml`) typically turns this into a cache hit and an
      # image load. On a cache miss (eviction, skipped upstream job) it falls
      # back to a full build with no functional difference.
      - name: Build RI image (with cache)
        if: steps.affected.outputs.result == 'true'
        run: docker compose -f docker-compose.e2e.yml --profile ri build

      - name: Start RI stack (${{ matrix.mode }})
        if: steps.affected.outputs.result == 'true'
        run: docker compose -f docker-compose.e2e.yml ${{ matrix.compose-override }} --profile ri up -d --no-build

      - name: Wait for app container
        if: steps.affected.outputs.result == 'true'
        run: |
          echo "--- Waiting up to 180s for app to respond on http://localhost:3003 ---"
          deadline=$(($(date +%s) + 180))
          while [ $(date +%s) -lt $deadline ]; do
            if curl -sS -o /dev/null -m 2 http://localhost:3003 2>/dev/null; then
              echo "--- App is responding ---"
              break
            fi
            sleep 2
          done
          echo "--- App container logs ---"
          docker compose -f docker-compose.e2e.yml ${{ matrix.compose-override }} --profile ri logs app
          echo "--- Container status ---"
          docker compose -f docker-compose.e2e.yml ${{ matrix.compose-override }} --profile ri ps
          if ! curl -sS -o /dev/null -m 2 http://localhost:3003 2>/dev/null; then
            echo "::error::App did not respond on :3003 within 180s (${{ matrix.mode }} mode)"
            exit 1
          fi

      - name: Run RI E2E tests (${{ matrix.mode }} mode)
        if: steps.affected.outputs.result == 'true'
        run: yarn workspace reference-implementation-e2e test:e2e:${{ matrix.mode }}
        env:
          NODE_OPTIONS: '--no-experimental-require-module --no-experimental-detect-module' # See issue https://github.com/cypress-io/github-action/issues/1408
          VERIFY_ALLOW_PRIVATE_URLS: 'true' # Skip SSRF E2E tests, Docker services use internal addresses

      - name: Dump RI container logs on failure
        if: failure() && steps.affected.outputs.result == 'true'
        run: docker compose -f docker-compose.e2e.yml ${{ matrix.compose-override }} --profile ri logs app

      - name: Stop RI stack
        if: steps.affected.outputs.result == 'true'
        run: docker compose -f docker-compose.e2e.yml ${{ matrix.compose-override }} --profile ri down -v

  e2e-playground:
    name: E2E (untp-playground)
    runs-on: ubuntu-latest
    needs: [quality, qa, build-e2e-images]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Enable Corepack
        run: corepack enable

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      # `quality` is the upstream installer (`needs: quality` via the qa chain),
      # so this restore should hit. The fallback install covers rare cache misses.
      - name: Restore node_modules cache
        id: cache-modules
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
            ~/.cache/Cypress
          key: node-modules-v3-${{ runner.os }}-${{ hashFiles('yarn.lock') }}

      - name: Install dependencies (fallback if cache restore missed)
        if: steps.cache-modules.outputs.cache-hit != 'true'
        run: yarn install --frozen-lockfile

      - name: Check whether playground E2E should run
        id: affected
        shell: bash
        run: |
          set -euo pipefail

          # Turbo dep graph for untp-playground.
          affected_json=$(yarn --silent turbo run build --filter='untp-playground...[origin/next]' --dry-run=json)
          if [ -z "$affected_json" ]; then
            echo "::error::turbo dry-run produced empty output"
            exit 1
          fi
          task_count=$(echo "$affected_json" | jq '.tasks | length')
          if ! [[ "$task_count" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not parse turbo task count: '$task_count'"
            echo "--- Raw output ---"
            echo "$affected_json"
            exit 1
          fi

          # Also trigger when files outside turbo's package graph change:
          # the playground e2e tree, docker-compose, the workflow itself.
          extra_changed=$(git diff --name-only origin/next...HEAD -- \
            'packages/untp-playground/e2e/**' \
            'docker-compose.e2e.yml' \
            '.github/workflows/build_test.yml' \
            | wc -l | tr -d ' ')

          if [ "$task_count" -gt 0 ] || [ "$extra_changed" -gt 0 ]; then
            echo "result=true" >> "$GITHUB_OUTPUT"
            echo "Playground E2E will run. turbo task_count=$task_count, extra_changed=$extra_changed."
          else
            echo "result=false" >> "$GITHUB_OUTPUT"
            echo "Playground E2E skipped. Dep graph unaffected and no playground e2e, docker-compose, or workflow files changed."
          fi

      # Mirrors the cleanup in e2e-ri; cheap insurance even though the
      # playground stack is lighter (3 services vs 8).
      # https://github.com/actions/runner-images/issues/2840#issuecomment-1284059930
      # https://github.com/uncefact/tests-untp/issues/344
      - name: Free up space on ubuntu runner for E2E tests
        if: steps.affected.outputs.result == 'true'
        run: |
          sudo rm -rf \
            "$AGENT_TOOLSDIRECTORY" \
            /opt/microsoft \
            /opt/pipx \
            /usr/local/.ghcup \
            /usr/local/graalvm* \
            /usr/local/julia* \
            /usr/local/lib/android \
            /usr/local/share/chromium \
            /usr/local/share/powershell \
            /usr/local/share/vcpkg \
            /usr/share/dotnet \
            /usr/share/miniconda \
            /usr/share/swift
          docker image prune -af

      - name: Set up Docker Buildx
        if: steps.affected.outputs.result == 'true'
        uses: docker/setup-buildx-action@v3

      # Re-runs `docker compose build` for the playground image. The buildx
      # GHA cache populated by `build-e2e-images` (`cache_from: type=gha,...`
      # in `docker-compose.e2e.yml`) typically turns this into a cache hit
      # and an image load. On a cache miss (eviction, skipped upstream job)
      # it falls back to a full build with no functional difference.
      - name: Build playground image (with cache)
        if: steps.affected.outputs.result == 'true'
        run: docker compose -f docker-compose.e2e.yml --profile playground build

      - name: Start playground stack
        if: steps.affected.outputs.result == 'true'
        run: docker compose -f docker-compose.e2e.yml --profile playground up -d --no-build

      - name: Wait for playground container
        if: steps.affected.outputs.result == 'true'
        run: |
          echo "--- Waiting up to 120s for playground to respond on http://localhost:4000 ---"
          deadline=$(($(date +%s) + 120))
          while [ $(date +%s) -lt $deadline ]; do
            if curl -sS -o /dev/null -m 2 http://localhost:4000 2>/dev/null; then
              echo "--- Playground is responding ---"
              break
            fi
            sleep 2
          done
          echo "--- Container status ---"
          docker compose -f docker-compose.e2e.yml --profile playground ps
          if ! curl -sS -o /dev/null -m 2 http://localhost:4000 2>/dev/null; then
            echo "::error::Playground did not respond on :4000 within 120s"
            docker compose -f docker-compose.e2e.yml --profile playground logs untp-playground
            exit 1
          fi

      - name: Run playground E2E tests
        if: steps.affected.outputs.result == 'true'
        run: yarn workspace untp-playground-e2e test:e2e
        env:
          NODE_OPTIONS: '--no-experimental-require-module --no-experimental-detect-module' # See issue https://github.com/cypress-io/github-action/issues/1408
          E2E_PLAYGROUND_BASE_URL: 'http://localhost:4000'

      - name: Dump playground container logs on failure
        if: failure() && steps.affected.outputs.result == 'true'
        run: docker compose -f docker-compose.e2e.yml --profile playground logs untp-playground

      - name: Stop playground stack
        if: steps.affected.outputs.result == 'true'
        run: docker compose -f docker-compose.e2e.yml --profile playground down -v
