name: Build and Test

on:
  pull_request:
    branches:
      - next

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Enable Corepack
        run: corepack enable

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Restore node_modules cache
        id: cache-modules
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: node-modules-v3-${{ runner.os }}-${{ hashFiles('yarn.lock') }}

      - name: Install dependencies
        if: steps.cache-modules.outputs.cache-hit != 'true'
        run: yarn install --frozen-lockfile

      - name: Save node_modules cache
        if: steps.cache-modules.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: node-modules-v3-${{ runner.os }}-${{ hashFiles('yarn.lock') }}

      - name: Check formatting
        run: yarn format:check

      - name: Check linting
        run: yarn lint:check

  qa:
    name: QA (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # untp-test-suite-mocha (no test script) and @test-untp/vc-test-suite
        # (test runs heavy mocha conformance, not unit tests) are deliberately
        # omitted; see ADR 006 adoption notes.
        package:
          - '@uncefact/untp-ri-services'
          - '@reference-implementation/components'
          - '@reference-implementation/core'
          - 'untp-playground'
          - 'untp-test-suite'
          - '@uncefact/untp-utils'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Enable Corepack
        run: corepack enable

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Restore node_modules cache
        id: cache-modules
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: node-modules-v3-${{ runner.os }}-${{ hashFiles('yarn.lock') }}

      - name: Install dependencies
        if: steps.cache-modules.outputs.cache-hit != 'true'
        run: yarn install --frozen-lockfile

      - name: Save node_modules cache
        if: steps.cache-modules.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: node-modules-v3-${{ runner.os }}-${{ hashFiles('yarn.lock') }}

      - name: Run build and test for ${{ matrix.package }} (and affected deps)
        run: yarn turbo run build test --filter='${{ matrix.package }}...[origin/next]'

  e2e:
    name: E2E (reference-implementation)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Enable Corepack
        run: corepack enable

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Restore node_modules cache
        id: cache-modules
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
            ~/.cache/Cypress
          key: node-modules-v3-${{ runner.os }}-${{ hashFiles('yarn.lock') }}

      - name: Install dependencies
        if: steps.cache-modules.outputs.cache-hit != 'true'
        run: yarn install --frozen-lockfile

      - name: Save node_modules cache
        if: steps.cache-modules.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
            ~/.cache/Cypress
          key: node-modules-v3-${{ runner.os }}-${{ hashFiles('yarn.lock') }}

      - name: Check whether E2E should run
        id: affected
        shell: bash
        run: |
          set -euo pipefail

          # Check turbo's dep graph for @reference-implementation/core.
          # If turbo or jq fail, surface the error rather than silently skipping E2E.
          affected_json=$(yarn --silent turbo run build --filter='@reference-implementation/core...[origin/next]' --dry-run=json)
          if [ -z "$affected_json" ]; then
            echo "::error::turbo dry-run produced empty output"
            exit 1
          fi
          task_count=$(echo "$affected_json" | jq '.tasks | length')
          if ! [[ "$task_count" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not parse turbo task count: '$task_count'"
            echo "--- Raw output ---"
            echo "$affected_json"
            exit 1
          fi

          # Also trigger E2E when files outside turbo's package graph change:
          # the cypress workspace, docker compose files, and the workflow itself.
          extra_changed=$(git diff --name-only origin/next...HEAD -- \
            'e2e/**' \
            'docker-compose.e2e.yml' \
            'docker-compose.e2e-closed.yml' \
            '.github/workflows/build_test.yml' \
            | wc -l | tr -d ' ')

          if [ "$task_count" -gt 0 ] || [ "$extra_changed" -gt 0 ]; then
            echo "result=true" >> "$GITHUB_OUTPUT"
            echo "E2E will run. turbo task_count=$task_count, extra_changed=$extra_changed."
          else
            echo "result=false" >> "$GITHUB_OUTPUT"
            echo "E2E skipped. Reference-implementation dep graph unaffected and no e2e/docker-compose/workflow files changed."
          fi

      # https://github.com/actions/runner-images/issues/2840#issuecomment-1284059930
      # https://github.com/uncefact/tests-untp/issues/344
      - name: Free up space on ubuntu runner for E2E tests
        if: steps.affected.outputs.result == 'true'
        run: |
          sudo rm -rf \
            "$AGENT_TOOLSDIRECTORY" \
            /opt/microsoft \
            /opt/pipx \
            /usr/local/.ghcup \
            /usr/local/graalvm* \
            /usr/local/julia* \
            /usr/local/lib/android \
            /usr/local/share/chromium \
            /usr/local/share/powershell \
            /usr/local/share/vcpkg \
            /usr/share/dotnet \
            /usr/share/miniconda \
            /usr/share/swift
          docker image prune -af

      - name: Build E2E images
        if: steps.affected.outputs.result == 'true'
        run: docker compose -f docker-compose.e2e.yml build

      - name: Start E2E docker compose
        if: steps.affected.outputs.result == 'true'
        run: docker compose -f docker-compose.e2e.yml up -d --no-build

      - name: Wait for app container and dump logs
        if: steps.affected.outputs.result == 'true'
        run: |
          echo "--- Waiting up to 180s for app to respond on http://localhost:3003 ---"
          deadline=$(($(date +%s) + 180))
          while [ $(date +%s) -lt $deadline ]; do
            if curl -sS -o /dev/null -m 2 http://localhost:3003 2>/dev/null; then
              echo "--- App is responding ---"
              break
            fi
            sleep 2
          done
          echo "--- App container logs ---"
          docker compose -f docker-compose.e2e.yml logs app
          echo "--- Container status ---"
          docker compose -f docker-compose.e2e.yml ps
          if ! curl -sS -o /dev/null -m 2 http://localhost:3003 2>/dev/null; then
            echo "::error::App did not respond on :3003 within 180s"
            exit 1
          fi

      - name: Run E2E tests (open mode)
        if: steps.affected.outputs.result == 'true'
        run: yarn test:e2e:open
        env:
          NODE_OPTIONS: '--no-experimental-require-module --no-experimental-detect-module' # See issue https://github.com/cypress-io/github-action/issues/1408
          VERIFY_ALLOW_PRIVATE_URLS: 'true' # Skip SSRF E2E tests, Docker services use internal addresses

      - name: Dump E2E container logs on failure
        if: failure() && steps.affected.outputs.result == 'true'
        run: docker compose -f docker-compose.e2e.yml logs app

      - name: Stop docker compose (with volumes for clean closed mode DB)
        if: steps.affected.outputs.result == 'true'
        run: docker compose -f docker-compose.e2e.yml down -v

      - name: Start closed mode E2E docker compose
        if: steps.affected.outputs.result == 'true'
        run: docker compose -f docker-compose.e2e.yml -f docker-compose.e2e-closed.yml up -d --no-build

      - name: Wait for closed mode app container
        if: steps.affected.outputs.result == 'true'
        run: |
          echo "--- Waiting up to 180s for app to respond on http://localhost:3003 ---"
          deadline=$(($(date +%s) + 180))
          while [ $(date +%s) -lt $deadline ]; do
            if curl -sS -o /dev/null -m 2 http://localhost:3003 2>/dev/null; then
              echo "--- App is responding ---"
              break
            fi
            sleep 2
          done
          echo "--- App container logs ---"
          docker compose -f docker-compose.e2e.yml -f docker-compose.e2e-closed.yml logs app
          echo "--- Container status ---"
          docker compose -f docker-compose.e2e.yml -f docker-compose.e2e-closed.yml ps
          if ! curl -sS -o /dev/null -m 2 http://localhost:3003 2>/dev/null; then
            echo "::error::App did not respond on :3003 within 180s (closed mode)"
            exit 1
          fi

      - name: Run closed mode E2E tests
        if: steps.affected.outputs.result == 'true'
        run: yarn test:e2e:closed
        env:
          NODE_OPTIONS: '--no-experimental-require-module --no-experimental-detect-module'
          VERIFY_ALLOW_PRIVATE_URLS: 'true'

      - name: Dump closed mode container logs on failure
        if: failure() && steps.affected.outputs.result == 'true'
        run: docker compose -f docker-compose.e2e.yml -f docker-compose.e2e-closed.yml logs app

      - name: Stop closed mode docker compose
        if: steps.affected.outputs.result == 'true'
        run: docker compose -f docker-compose.e2e.yml -f docker-compose.e2e-closed.yml down -v

  build_docs:
    name: Docs build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: yarn

      - name: Install and build documentation
        run: |
          cd documentation
          yarn install --frozen-lockfile
          yarn build
        env:
          DOCS_BASE_URL: ${{ vars.DOCS_BASE_URL }}
          DOCS_URL: ${{ vars.DOCS_URL }}
