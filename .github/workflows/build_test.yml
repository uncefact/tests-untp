name: Build and Test

on:
  # Trigger on every pull request regardless of base branch. Stacked PRs
  # (which target an in-flight feature branch instead of `next`) need CI
  # too; the previous `branches: [next]` filter skipped them silently.
  pull_request: {}
  # Running on push to `next` (post-merge) is intentional: it lets the
  # `quality` job populate the `node_modules` cache from `refs/heads/next`,
  # which subsequent PRs can then restore from. GitHub Actions caches
  # written from a PR ref are scoped to that PR; only caches written from
  # the base branch are shared across PRs targeting it.
  push:
    branches:
      - next

# Default permissions: read-only access to repo contents. Individual jobs can
# request additional permissions if they need to write (none currently do).
permissions:
  contents: read

concurrency:
  # PRs key on the PR number so updating a PR cancels its in-flight run.
  # Push events on `next` key on the branch ref so back-to-back merges
  # supersede each other (older runs are cancelled in favour of the latest).
  group: ${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || format('push-{0}', github.ref) }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Enable Corepack
        run: corepack enable

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Restore node_modules cache
        id: cache-modules
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
            packages/*/e2e/node_modules
            ~/.cache/Cypress
          key: node-modules-v4-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        if: steps.cache-modules.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: Save node_modules cache
        if: steps.cache-modules.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
            packages/*/e2e/node_modules
            ~/.cache/Cypress
          key: node-modules-v4-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Check formatting
        run: pnpm format:check

      - name: Check linting
        run: pnpm lint:check

  qa:
    name: QA (${{ matrix.package }})
    runs-on: ubuntu-latest
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        # untp-test-suite-mocha is deliberately omitted: it has no test script
        # and runs heavy Mocha conformance tests, not unit tests. See ADR 006
        # adoption notes.
        package:
          - '@uncefact/untp-ri-services'
          - '@reference-implementation/components'
          - 'untp-reference-implementation'
          - 'untp-playground'
          - '@uncefact/untp-utils'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Enable Corepack
        run: corepack enable

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      # `quality` is the upstream installer (`needs: quality`), so this restore
      # should hit. The fallback install handles rare cache misses (e.g. cache
      # eviction) without failing the job.
      - name: Restore node_modules cache
        id: cache-modules
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
            packages/*/e2e/node_modules
            ~/.cache/Cypress
          key: node-modules-v4-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies (fallback if cache restore missed)
        if: steps.cache-modules.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: Build ${{ matrix.package }} (and affected deps)
        run: pnpm turbo run build --filter='${{ matrix.package }}...[origin/next]'

      # `--changedSince=origin/next` is passed through to jest so file-level
      # affected filtering still applies inside each package. `pnpm exec`
      # forwards `--` cleanly to turbo, unlike `pnpm turbo --` which gets
      # consumed by pnpm itself.
      - name: Test ${{ matrix.package }} (changed files only)
        run: pnpm exec turbo run test --filter='${{ matrix.package }}...[origin/next]' -- --changedSince=origin/next

  # Per-app image build jobs run in parallel after qa. Each downstream E2E
  # job depends only on its own image-build job so the playground E2E starts
  # as soon as the playground image is ready (not blocked on the RI image),
  # and the RI E2E matrix starts as soon as the RI image is ready.
  build-e2e-image-ri:
    name: Build E2E image (RI)
    runs-on: ubuntu-latest
    needs: [quality, qa]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Enable Corepack
        run: corepack enable

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Restore node_modules cache
        id: cache-modules
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
            packages/*/e2e/node_modules
            ~/.cache/Cypress
          key: node-modules-v4-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies (fallback if cache restore missed)
        if: steps.cache-modules.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: Check whether RI image needs building
        id: affected
        shell: bash
        run: |
          set -euo pipefail

          json=$(pnpm --silent turbo run build --filter='untp-reference-implementation...[origin/next]' --dry-run=json)
          if [ -z "$json" ]; then
            echo "::error::turbo dry-run produced empty output"
            exit 1
          fi
          count=$(echo "$json" | jq '.tasks | length')
          if ! [[ "$count" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not parse turbo task count: '$count'"
            echo "--- Raw output ---"
            echo "$json"
            exit 1
          fi

          # Note: `.github/workflows/build_test.yml` is treated as shared and
          # invalidates both image builds; any workflow edit forces a rebuild.
          extra=$(git diff --name-only origin/next...HEAD -- \
            'packages/reference-implementation/e2e/**' \
            'docker-compose.e2e.yml' \
            'docker-compose.e2e-closed.yml' \
            '.github/workflows/build_test.yml' \
            | wc -l | tr -d ' ')

          if [ "$count" -gt 0 ] || [ "$extra" -gt 0 ]; then
            echo "result=true" >> "$GITHUB_OUTPUT"
            echo "RI image will be built. turbo task_count=$count, extra=$extra."
          else
            echo "result=false" >> "$GITHUB_OUTPUT"
            echo "RI image skipped."
          fi

      - name: Set up Docker Buildx
        if: steps.affected.outputs.result == 'true'
        uses: docker/setup-buildx-action@v3

      # Builds the RI image via `docker/build-push-action@v6` so the GHA
      # cache backend actually exports layers. The previous approach used
      # `docker compose build` with `cache_to` declared in
      # `docker-compose.e2e.yml`, but compose silently failed to
      # propagate `cache_to` to BuildKit when running the bake from
      # stdin (https://github.com/docker/compose/issues/9094), so the
      # downstream `e2e-ri` matrix had nothing to pull from and ended
      # up rebuilding every layer.
      #
      # `load: true` puts the resulting image into the runner's Docker
      # daemon under the `app:e2e` tag, matching the `image:` field on
      # the `app` service in `docker-compose.e2e.yml`, so the downstream
      # job's `docker compose up -d --no-build` finds it locally.
      - name: Build RI image
        if: steps.affected.outputs.result == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./packages/reference-implementation/Dockerfile
          target: development
          tags: app:e2e
          load: true
          cache-from: type=gha,scope=reference-implementation-e2e
          cache-to: type=gha,scope=reference-implementation-e2e,mode=max

  build-e2e-image-playground:
    name: Build E2E image (playground)
    runs-on: ubuntu-latest
    needs: [quality, qa]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Enable Corepack
        run: corepack enable

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Restore node_modules cache
        id: cache-modules
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
            packages/*/e2e/node_modules
            ~/.cache/Cypress
          key: node-modules-v4-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies (fallback if cache restore missed)
        if: steps.cache-modules.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: Check whether playground image needs building
        id: affected
        shell: bash
        run: |
          set -euo pipefail

          json=$(pnpm --silent turbo run build --filter='untp-playground...[origin/next]' --dry-run=json)
          if [ -z "$json" ]; then
            echo "::error::turbo dry-run produced empty output"
            exit 1
          fi
          count=$(echo "$json" | jq '.tasks | length')
          if ! [[ "$count" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not parse turbo task count: '$count'"
            echo "--- Raw output ---"
            echo "$json"
            exit 1
          fi

          extra=$(git diff --name-only origin/next...HEAD -- \
            'packages/untp-playground/e2e/**' \
            'docker-compose.e2e.yml' \
            '.github/workflows/build_test.yml' \
            | wc -l | tr -d ' ')

          if [ "$count" -gt 0 ] || [ "$extra" -gt 0 ]; then
            echo "result=true" >> "$GITHUB_OUTPUT"
            echo "Playground image will be built. turbo task_count=$count, extra=$extra."
          else
            echo "result=false" >> "$GITHUB_OUTPUT"
            echo "Playground image skipped."
          fi

      - name: Set up Docker Buildx
        if: steps.affected.outputs.result == 'true'
        uses: docker/setup-buildx-action@v3

      # See the matching `Build RI image` step above for why this uses
      # `docker/build-push-action@v6` instead of `docker compose build`.
      - name: Build playground image
        if: steps.affected.outputs.result == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./packages/untp-playground/Dockerfile
          tags: untp-playground:e2e
          load: true
          cache-from: type=gha,scope=untp-playground-e2e
          cache-to: type=gha,scope=untp-playground-e2e,mode=max

  e2e-ri:
    name: E2E RI (${{ matrix.mode }})
    runs-on: ubuntu-latest
    needs: [quality, qa, build-e2e-image-ri]
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: open
            compose-override: ''
          - mode: closed
            compose-override: '-f docker-compose.e2e-closed.yml'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Enable Corepack
        run: corepack enable

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Restore node_modules cache
        id: cache-modules
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
            packages/*/e2e/node_modules
            ~/.cache/Cypress
          key: node-modules-v4-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies (fallback if cache restore missed)
        if: steps.cache-modules.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: Check whether E2E should run
        id: affected
        shell: bash
        run: |
          set -euo pipefail

          affected_json=$(pnpm --silent turbo run build --filter='untp-reference-implementation...[origin/next]' --dry-run=json)
          if [ -z "$affected_json" ]; then
            echo "::error::turbo dry-run produced empty output"
            exit 1
          fi
          task_count=$(echo "$affected_json" | jq '.tasks | length')
          if ! [[ "$task_count" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not parse turbo task count: '$task_count'"
            echo "--- Raw output ---"
            echo "$affected_json"
            exit 1
          fi

          extra_changed=$(git diff --name-only origin/next...HEAD -- \
            'packages/reference-implementation/e2e/**' \
            'docker-compose.e2e.yml' \
            'docker-compose.e2e-closed.yml' \
            '.github/workflows/build_test.yml' \
            | wc -l | tr -d ' ')

          if [ "$task_count" -gt 0 ] || [ "$extra_changed" -gt 0 ]; then
            echo "result=true" >> "$GITHUB_OUTPUT"
            echo "RI E2E (${{ matrix.mode }}) will run. turbo task_count=$task_count, extra_changed=$extra_changed."
          else
            echo "result=false" >> "$GITHUB_OUTPUT"
            echo "RI E2E (${{ matrix.mode }}) skipped. Reference-implementation dep graph unaffected and no RI e2e/compose/workflow files changed."
          fi

      # https://github.com/actions/runner-images/issues/2840#issuecomment-1284059930
      # https://github.com/uncefact/tests-untp/issues/344
      #
      # Background each rm so the kernel can parallelise unlink syscalls
      # across cores. The big paths (/usr/local/lib/android, /usr/share/dotnet,
      # /usr/share/miniconda) dominate wall time when run sequentially;
      # in parallel the total drops to roughly the slowest single rm.
      - name: Free up space on ubuntu runner for E2E tests
        if: steps.affected.outputs.result == 'true'
        run: |
          set -e
          sudo rm -rf "$AGENT_TOOLSDIRECTORY" &
          sudo rm -rf /opt/microsoft &
          sudo rm -rf /opt/pipx &
          sudo rm -rf /usr/local/.ghcup &
          sudo rm -rf /usr/local/graalvm* &
          sudo rm -rf /usr/local/julia* &
          sudo rm -rf /usr/local/lib/android &
          sudo rm -rf /usr/local/share/chromium &
          sudo rm -rf /usr/local/share/powershell &
          sudo rm -rf /usr/local/share/vcpkg &
          sudo rm -rf /usr/share/dotnet &
          sudo rm -rf /usr/share/miniconda &
          sudo rm -rf /usr/share/swift &
          wait
          docker image prune -af

      - name: Set up Docker Buildx
        if: steps.affected.outputs.result == 'true'
        uses: docker/setup-buildx-action@v3

      # Re-runs the RI image build but with full cache_from against the
      # GHA scope populated by `build-e2e-image-ri`. With cache hit this
      # is essentially a layer-reconstitution + image load step
      # (~30-60s). With cache miss (e.g. eviction) it falls back to a
      # full build with no functional difference.
      #
      # Uses `docker/build-push-action@v6` rather than `docker compose
      # build` because compose doesn't reliably propagate `cache_from`
      # to BuildKit when running its bake from stdin
      # (https://github.com/docker/compose/issues/9094).
      - name: Build RI image (with cache)
        if: steps.affected.outputs.result == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./packages/reference-implementation/Dockerfile
          target: development
          tags: app:e2e
          load: true
          cache-from: type=gha,scope=reference-implementation-e2e

      - name: Start RI stack (${{ matrix.mode }})
        if: steps.affected.outputs.result == 'true'
        run: docker compose -f docker-compose.e2e.yml ${{ matrix.compose-override }} --profile ri up -d --no-build

      - name: Wait for app container
        if: steps.affected.outputs.result == 'true'
        run: |
          echo "--- Waiting up to 180s for app to respond on http://localhost:3003 ---"
          deadline=$(($(date +%s) + 180))
          while [ $(date +%s) -lt $deadline ]; do
            if curl -sS -o /dev/null -m 2 http://localhost:3003 2>/dev/null; then
              echo "--- App is responding ---"
              break
            fi
            sleep 2
          done
          echo "--- App container logs ---"
          docker compose -f docker-compose.e2e.yml ${{ matrix.compose-override }} --profile ri logs app
          echo "--- Container status ---"
          docker compose -f docker-compose.e2e.yml ${{ matrix.compose-override }} --profile ri ps
          if ! curl -sS -o /dev/null -m 2 http://localhost:3003 2>/dev/null; then
            echo "::error::App did not respond on :3003 within 180s (${{ matrix.mode }} mode)"
            exit 1
          fi

      - name: Run RI E2E tests (${{ matrix.mode }} mode)
        if: steps.affected.outputs.result == 'true'
        run: pnpm --filter reference-implementation-e2e test:e2e:${{ matrix.mode }}
        env:
          NODE_OPTIONS: '--no-experimental-require-module --no-experimental-detect-module' # See issue https://github.com/cypress-io/github-action/issues/1408
          VERIFY_ALLOW_PRIVATE_URLS: 'true' # Skip SSRF E2E tests, Docker services use internal addresses

      - name: Dump RI container logs on failure
        if: failure() && steps.affected.outputs.result == 'true'
        run: docker compose -f docker-compose.e2e.yml ${{ matrix.compose-override }} --profile ri logs app

      - name: Stop RI stack
        if: steps.affected.outputs.result == 'true'
        run: docker compose -f docker-compose.e2e.yml ${{ matrix.compose-override }} --profile ri down -v

  e2e-playground:
    name: E2E (untp-playground)
    runs-on: ubuntu-latest
    needs: [quality, qa, build-e2e-image-playground]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Enable Corepack
        run: corepack enable

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      # `quality` is the upstream installer (`needs: quality` via the qa chain),
      # so this restore should hit. The fallback install covers rare cache misses.
      - name: Restore node_modules cache
        id: cache-modules
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
            packages/*/e2e/node_modules
            ~/.cache/Cypress
          key: node-modules-v4-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies (fallback if cache restore missed)
        if: steps.cache-modules.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: Check whether playground E2E should run
        id: affected
        shell: bash
        run: |
          set -euo pipefail

          # Turbo dep graph for @uncefact/untp-playground.
          affected_json=$(pnpm --silent turbo run build --filter='untp-playground...[origin/next]' --dry-run=json)
          if [ -z "$affected_json" ]; then
            echo "::error::turbo dry-run produced empty output"
            exit 1
          fi
          task_count=$(echo "$affected_json" | jq '.tasks | length')
          if ! [[ "$task_count" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not parse turbo task count: '$task_count'"
            echo "--- Raw output ---"
            echo "$affected_json"
            exit 1
          fi

          # Also trigger when files outside turbo's package graph change:
          # the playground e2e tree, docker-compose, the workflow itself.
          extra_changed=$(git diff --name-only origin/next...HEAD -- \
            'packages/untp-playground/e2e/**' \
            'docker-compose.e2e.yml' \
            '.github/workflows/build_test.yml' \
            | wc -l | tr -d ' ')

          if [ "$task_count" -gt 0 ] || [ "$extra_changed" -gt 0 ]; then
            echo "result=true" >> "$GITHUB_OUTPUT"
            echo "Playground E2E will run. turbo task_count=$task_count, extra_changed=$extra_changed."
          else
            echo "result=false" >> "$GITHUB_OUTPUT"
            echo "Playground E2E skipped. Dep graph unaffected and no playground e2e, docker-compose, or workflow files changed."
          fi

      # Mirrors the cleanup in e2e-ri; cheap insurance even though the
      # playground stack is lighter (3 services vs 8).
      # https://github.com/actions/runner-images/issues/2840#issuecomment-1284059930
      # https://github.com/uncefact/tests-untp/issues/344
      #
      # Background each rm so the kernel can parallelise unlink syscalls
      # across cores. The big paths (/usr/local/lib/android, /usr/share/dotnet,
      # /usr/share/miniconda) dominate wall time when run sequentially;
      # in parallel the total drops to roughly the slowest single rm.
      - name: Free up space on ubuntu runner for E2E tests
        if: steps.affected.outputs.result == 'true'
        run: |
          set -e
          sudo rm -rf "$AGENT_TOOLSDIRECTORY" &
          sudo rm -rf /opt/microsoft &
          sudo rm -rf /opt/pipx &
          sudo rm -rf /usr/local/.ghcup &
          sudo rm -rf /usr/local/graalvm* &
          sudo rm -rf /usr/local/julia* &
          sudo rm -rf /usr/local/lib/android &
          sudo rm -rf /usr/local/share/chromium &
          sudo rm -rf /usr/local/share/powershell &
          sudo rm -rf /usr/local/share/vcpkg &
          sudo rm -rf /usr/share/dotnet &
          sudo rm -rf /usr/share/miniconda &
          sudo rm -rf /usr/share/swift &
          wait
          docker image prune -af

      - name: Set up Docker Buildx
        if: steps.affected.outputs.result == 'true'
        uses: docker/setup-buildx-action@v3

      # See the matching `Build RI image (with cache)` step in the
      # `e2e-ri` job above for why this uses
      # `docker/build-push-action@v6` rather than `docker compose build`.
      - name: Build playground image (with cache)
        if: steps.affected.outputs.result == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./packages/untp-playground/Dockerfile
          tags: untp-playground:e2e
          load: true
          cache-from: type=gha,scope=untp-playground-e2e

      - name: Start playground stack
        if: steps.affected.outputs.result == 'true'
        run: docker compose -f docker-compose.e2e.yml --profile playground up -d --no-build

      - name: Wait for playground container
        if: steps.affected.outputs.result == 'true'
        run: |
          echo "--- Waiting up to 120s for playground to respond on http://localhost:4000 ---"
          deadline=$(($(date +%s) + 120))
          while [ $(date +%s) -lt $deadline ]; do
            if curl -sS -o /dev/null -m 2 http://localhost:4000 2>/dev/null; then
              echo "--- Playground is responding ---"
              break
            fi
            sleep 2
          done
          echo "--- Container status ---"
          docker compose -f docker-compose.e2e.yml --profile playground ps
          if ! curl -sS -o /dev/null -m 2 http://localhost:4000 2>/dev/null; then
            echo "::error::Playground did not respond on :4000 within 120s"
            docker compose -f docker-compose.e2e.yml --profile playground logs untp-playground
            exit 1
          fi

      - name: Run playground E2E tests
        if: steps.affected.outputs.result == 'true'
        run: pnpm --filter untp-playground-e2e test:e2e
        env:
          NODE_OPTIONS: '--no-experimental-require-module --no-experimental-detect-module' # See issue https://github.com/cypress-io/github-action/issues/1408
          E2E_PLAYGROUND_BASE_URL: 'http://localhost:4000'

      - name: Dump playground container logs on failure
        if: failure() && steps.affected.outputs.result == 'true'
        run: docker compose -f docker-compose.e2e.yml --profile playground logs untp-playground

      - name: Stop playground stack
        if: steps.affected.outputs.result == 'true'
        run: docker compose -f docker-compose.e2e.yml --profile playground down -v
