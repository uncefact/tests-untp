name: Docker — Reference Implementation

# Triggers:
#   - push to `next` rebuilds the rolling `:next` image on every merge.
#   - pushing a `reference-implementation-v<X.Y.Z>` git tag (e.g.
#     `reference-implementation-v0.3.0`) builds a release image tagged
#     with the semver tag and `:latest`. The semver tag is consumed by
#     downstream deployments to pin a specific release.
#   - workflow_dispatch lets a maintainer rebuild a release on demand
#     without re-tagging git.

on:
  push:
    branches:
      - next
    paths:
      - 'packages/reference-implementation/**'
      - 'packages/services/**'
      - 'packages/components/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'packages/reference-implementation/Dockerfile'
      - '.github/workflows/docker-ri.yml'
    tags:
      - 'reference-implementation-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Semver version to tag this build with (e.g. 0.3.0). Omit to push only :next.'
        required: false
        type: string

concurrency:
  group: docker-ri-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    if: github.repository_owner == 'uncefact'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Only a tag push publishes a versioned image, so only a tag push needs the
      # check. Without it a tag pushed ahead of its version bump would publish an
      # image labelled with a version the tree does not carry.
      - name: Verify tag/package version match
        if: startsWith(github.ref, 'refs/tags/reference-implementation-v')
        run: node scripts/check-tag-version-match.mjs reference-implementation-v packages/reference-implementation

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/reference-implementation
          # Tag strategy:
          #   - On branch push to `next`: `:next`.
          #   - On git tag `reference-implementation-vX.Y.Z`: pulls X.Y.Z
          #     and emits semver tags `:X.Y.Z`, `:X.Y`, `:X`, plus `:latest`.
          #   - On workflow_dispatch: emits `:next`; if `version` input is
          #     supplied, also emits `:<version>` and `:latest`.
          tags: |
            type=raw,value=next,enable=${{ github.ref == 'refs/heads/next' }}
            type=match,pattern=reference-implementation-v(.*),group=1,enable=${{ startsWith(github.ref, 'refs/tags/reference-implementation-v') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/reference-implementation-v') && !contains(github.ref_name, '-rc') && !contains(github.ref_name, '-alpha') && !contains(github.ref_name, '-beta') && !contains(github.ref_name, '-pre') }}
            type=raw,value=${{ inputs.version }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.version != '' }}
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_dispatch' && inputs.version != '' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./packages/reference-implementation/Dockerfile
          target: build
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Scope per workflow so the RI build does not share a cache key
          # with the playground build. Unscoped `type=gha` caches collide
          # across workflows, evicting each other's deps + builder layers.
          cache-from: type=gha,scope=docker-ri
          cache-to: type=gha,scope=docker-ri,mode=max
