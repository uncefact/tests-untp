name: Docker — Reference Implementation

# Triggers:
#   - push to `next` rebuilds the rolling `:next` image on every merge.
#   - pushing a `reference-implementation-v<X.Y.Z>` git tag (e.g.
#     `reference-implementation-v0.3.0`) builds a release image tagged
#     with the semver tag only (never `:latest` on the 0.4.x line). The
#     semver tag is consumed by downstream deployments to pin a specific
#     release.
#   - workflow_dispatch lets a maintainer rebuild a release on demand
#     without re-tagging git. The version input must be the exact X.Y.Z
#     version in packages/reference-implementation/package.json.

on:
  push:
    branches:
      - next
    paths:
      - 'packages/reference-implementation/**'
      - 'packages/services/**'
      - 'packages/components/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'packages/reference-implementation/Dockerfile'
      - '.github/workflows/docker-ri.yml'
    tags:
      - 'reference-implementation-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact X.Y.Z version to republish, equal to the package version (e.g. 0.4.1). Omit when running on a reference-implementation-v tag.'
        required: false
        type: string

concurrency:
  group: docker-ri-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    if: github.repository_owner == 'uncefact'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # This line publishes exact version tags only. A floating name such as
      # `latest`, `next` or `0.4` from the tag or the manual input would move a
      # tag the newest release line owns, and another line's version would
      # overwrite that release's image, so refuse both here. Each version must
      # also equal the package version, so an image is never labelled with a
      # version the tree does not carry.
      - name: Check the release version
        env:
          REF: ${{ github.ref }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          versions=()
          if [[ "$REF" == refs/tags/reference-implementation-v* ]]; then
            versions+=("${REF#refs/tags/reference-implementation-v}")
          fi
          if [[ -n "$INPUT_VERSION" ]]; then
            versions+=("$INPUT_VERSION")
          fi
          if [[ ${#versions[@]} -eq 0 ]]; then
            echo "::error::No release version. Push a reference-implementation-vX.Y.Z tag or pass an X.Y.Z version input."
            exit 1
          fi
          for v in "${versions[@]}"; do
            if [[ ! "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              printf 'Rejected version: %q\n' "$v"
              echo "::error::The version is not an exact X.Y.Z version, so nothing is published."
              exit 1
            fi
            GITHUB_REF_NAME="reference-implementation-v$v" node scripts/check-tag-version-match.mjs reference-implementation-v packages/reference-implementation
          done

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/reference-implementation
          # Tag strategy for the 0.4.x maintenance line:
          #   - On git tag `reference-implementation-vX.Y.Z`: `:X.Y.Z` only.
          #   - On workflow_dispatch with a `version` input: `:<version>` only.
          # `:latest` belongs to the newest release line, so a patch on this
          # line must never move it. `latest=false` also turns off the
          # automatic `:latest` that type=match adds on a tag push.
          flavor: |
            latest=false
          tags: |
            type=raw,value=next,enable=${{ github.ref == 'refs/heads/next' }}
            type=match,pattern=reference-implementation-v(.*),group=1,enable=${{ startsWith(github.ref, 'refs/tags/reference-implementation-v') }}
            type=raw,value=${{ inputs.version }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.version != '' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./packages/reference-implementation/Dockerfile
          target: build
          # amd64 only on this maintenance line: the arm64 build runs under QEMU, which
          # stops with an illegal instruction in the Next.js 15.5.28 build.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Scope per workflow so the RI build does not share a cache key
          # with the playground build. Unscoped `type=gha` caches collide
          # across workflows, evicting each other's deps + builder layers.
          cache-from: type=gha,scope=docker-ri
          cache-to: type=gha,scope=docker-ri,mode=max
