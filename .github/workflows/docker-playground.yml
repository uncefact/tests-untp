name: Docker — UNTP Playground

# Triggers:
#   - push to `next` rebuilds the rolling `:next` image on every merge.
#   - pushing an `untp-playground-v<X.Y.Z>` git tag (e.g.
#     `untp-playground-v0.3.0`) builds a release image tagged with the
#     semver tag only. This is a maintenance line: `:latest` belongs to
#     the newest playground release, so a patch on this line must not
#     move it.
#   - workflow_dispatch lets a maintainer rebuild a release on demand
#     without re-tagging git.

on:
  push:
    branches:
      - next
    paths:
      - 'packages/untp-playground/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/docker-playground.yml'
    tags:
      - 'untp-playground-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact X.Y.Z version to tag this build with (e.g. 0.3.1). Omit when running on an untp-playground-v tag.'
        required: false
        type: string

concurrency:
  group: docker-playground-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    if: github.repository_owner == 'uncefact'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # This line publishes exact version tags only. A floating name such
      # as `latest`, `next` or `0.3` from the tag or the manual input would
      # move a tag the newest release line owns, so refuse it here.
      - name: Check the release version
        env:
          REF: ${{ github.ref }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          versions=()
          if [[ "$REF" == refs/tags/untp-playground-v* ]]; then
            versions+=("${REF#refs/tags/untp-playground-v}")
          fi
          if [[ -n "$INPUT_VERSION" ]]; then
            versions+=("$INPUT_VERSION")
          fi
          if [[ ${#versions[@]} -eq 0 ]]; then
            echo "::error::No release version. Push an untp-playground-vX.Y.Z tag or pass an X.Y.Z version input."
            exit 1
          fi
          for v in "${versions[@]}"; do
            if [[ ! "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              printf 'Rejected version: %q\n' "$v"
              echo "::error::The version is not an exact X.Y.Z version, so nothing is published."
              exit 1
            fi
          done

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/untp-playground
          # Tag strategy mirrors docker-ri.yml, without `:latest`.
          # `latest=false` stops the `type=match` rule adding `:latest`
          # on its own.
          flavor: |
            latest=false
          tags: |
            type=raw,value=next,enable=${{ github.ref == 'refs/heads/next' }}
            type=match,pattern=untp-playground-v(.*),group=1,enable=${{ startsWith(github.ref, 'refs/tags/untp-playground-v') }}
            type=raw,value=${{ inputs.version }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.version != '' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./packages/untp-playground/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
