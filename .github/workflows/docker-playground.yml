name: Docker — UNTP Playground

on:
  push:
    branches:
      - next
    paths:
      - 'packages/untp-playground/**'
      - 'yarn.lock'
      - '.github/workflows/docker-playground.yml'
  workflow_dispatch:

concurrency:
  group: docker-playground-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    if: github.repository_owner == 'uncefact'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/untp-playground
          tags: |
            type=raw,value=next

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./packages/untp-playground/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
