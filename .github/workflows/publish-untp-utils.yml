name: 'Publish — @uncefact/untp-utils'

# Per-package publish workflow for @uncefact/untp-utils. Triggers on push of
# a tag matching `untp-utils-v<X.Y.Z>` (stable) or `untp-utils-v<X.Y.Z>-rc.N`
# / `-alpha.N` / `-beta.N` / `-pre.N` (pre-release). The tag is the release
# event; this workflow publishes the artefact and nothing else.
#
# Authentication uses npm OIDC Trusted Publishing. The npmjs.com Trusted
# Publisher for `@uncefact/untp-utils` must be configured to point at this
# workflow filename.
#
# See ADR 031: docs/adrs/031-per-package-tag-triggered-npm-release.md

on:
  push:
    tags:
      - 'untp-utils-v*'

concurrency:
  group: publish-untp-utils-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    if: github.repository_owner == 'uncefact'

    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Verify checkout
        run: |
          ACTUAL=$(git rev-parse HEAD)
          if [ "$ACTUAL" != "${{ github.sha }}" ]; then
            echo "::error::Wrong checkout. Expected ${{ github.sha }}, got $ACTUAL"
            exit 1
          fi

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter '@uncefact/untp-utils...'

      - name: Verify tag/package version match
        run: node scripts/check-tag-version-match.mjs untp-utils-v packages/untp-utils

      - name: Build
        run: pnpm --filter '@uncefact/untp-utils' run build

      - name: Determine npm dist-tag
        id: dist
        run: |
          if [[ "${GITHUB_REF_NAME}" =~ -(rc|alpha|beta|pre)\. ]]; then
            echo "tag=rc" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        working-directory: packages/untp-utils
        env:
          NPM_CONFIG_PROVENANCE: 'true'
        run: pnpm publish --no-git-checks --access public --tag ${{ steps.dist.outputs.tag }}
