services:
  ri-db:
    image: postgres:17-alpine
    ports:
      - 5433:5432
    environment:
      - POSTGRES_USER=${RI_POSTGRES_USER:-ri-postgres}
      - POSTGRES_PASSWORD=${RI_POSTGRES_PASSWORD:-changeme}
      - POSTGRES_DB=${RI_POSTGRES_DB:-ri}
    volumes:
      - ri-db-data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${RI_POSTGRES_USER:-ri-postgres} -d ${RI_POSTGRES_DB:-ri}']
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.4.2
    command:
      - start-dev
      - --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-changeme}
      KC_HEALTH_ENABLED: 'true'
      KC_HOSTNAME: http://keycloak:8080
      KC_HOSTNAME_STRICT: 'false'
    ports:
      - '127.0.0.1:${KEYCLOAK_PORT:-8080}:8080' # See https://github.com/quarkusio/quarkus/discussions/48905#discussioncomment-14213858
      - '9990:9000' # Port for health checks
    volumes:
      - ./keycloak-realms:/opt/keycloak/data/import:ro
      - keycloak-data:/opt/keycloak/data

  documentation:
    build:
      context: ./documentation
      dockerfile: Dockerfile
    ports:
      - 3002:3002
    env_file:
      - path: ./documentation/.env
        required: false
    volumes:
      - ./documentation:/app
      - /app/node_modules

  untp-playground:
    build:
      context: .
      dockerfile: packages/untp-playground/Dockerfile
    ports:
      - '4000:3000'
    volumes:
      - ./packages/untp-playground:/untp-playground
      - /untp-playground/node_modules
    environment:
      - NODE_ENV=development
      - VERIFICATION_SERVICE_URL=${VERIFICATION_SERVICE_URL:-http://localhost:3332/agent/routeVerificationCredential}
      - VERIFICATION_SERVICE_TOKEN=${VERIFICATION_SERVICE_TOKEN:-test123}

  vckit-api:
    image: ghcr.io/uncefact/project-vckit:1.2.1@sha256:9c6f305ee7834e311dbcc7d6fec98bdf350d6064bfbc71781b11088020fc0ae0
    env_file:
      - local.env
    ports:
      - 3332:3332
    depends_on:
      - db
    healthcheck:
      test: ['CMD-SHELL', 'wget --quiet --spider http://localhost:3332/agent-api-docs || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  ri:
    build:
      context: .
      dockerfile: packages/reference-implementation/Dockerfile
    ports:
      - '3003:3003'
    environment:
      # Database (docker internal networking — host/port differ from .env)
      RI_POSTGRES_USER: ${RI_POSTGRES_USER:-ri-postgres}
      RI_POSTGRES_PASSWORD: ${RI_POSTGRES_PASSWORD:-changeme}
      RI_POSTGRES_DB: ${RI_POSTGRES_DB:-ri}
      RI_POSTGRES_HOST: ri-db
      RI_POSTGRES_PORT: 5432
      # Auth
      AUTH_OIDC_PROVIDER: ${AUTH_OIDC_PROVIDER:-keycloak}
      AUTH_OIDC_CLIENT_ID: ${AUTH_OIDC_CLIENT_ID:-ri-app}
      AUTH_OIDC_CLIENT_SECRET: ${AUTH_OIDC_CLIENT_SECRET:-changeme}
      AUTH_OIDC_ISSUER: http://keycloak:8080/realms/${KEYCLOAK_REALM:-ri-local}
      AUTH_OIDC_AUTHORIZATION_URL: http://localhost:${KEYCLOAK_PORT:-8080}/realms/${KEYCLOAK_REALM:-ri-local}/protocol/openid-connect/auth
      AUTH_OIDC_SERVICE_ACCOUNT_AUDIENCE: ${AUTH_OIDC_SERVICE_ACCOUNT_AUDIENCE:-ri-api}
      AUTH_SECRET: ${AUTH_SECRET:-change-me-in-production}
      AUTH_TRUST_HOST: "true"
      RI_APP_URL: http://localhost:3003
      # Tenant mode
      TENANT_MODE: ${TENANT_MODE:-open}
      TENANT_CLAIM_NAME: ${TENANT_CLAIM_NAME:-groups}
      TENANT_CLAIM_FORMAT: ${TENANT_CLAIM_FORMAT:-array_first}
      # Encryption at rest (service instance configs and credential decryption keys).
      # Both names pass through unchanged so the application sees exactly what the
      # host set: the deprecated-name fallback and the divergent-values hard fail
      # happen in one place (resolve-data-encryption-key.ts), not in compose
      # interpolation. The local-development value comes from .env (see
      # .env.example), which the quick start copies.
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:-}
      SERVICE_ENCRYPTION_KEY: ${SERVICE_ENCRYPTION_KEY:-}
      # Verification URLs
      DEFAULT_HUMAN_VERIFICATION_URL: http://localhost:3003/verify
      DEFAULT_MACHINE_VERIFICATION_URL: http://localhost:3332/agent/routeVerificationCredential
      # Credential verification
      VERIFY_ALLOW_PRIVATE_URLS: "true"
      # System default service instances (used by seed.ts)
      SYSTEM_VC_BASE_URL: http://vckit-api:3332
      SYSTEM_VC_API_KEY: ${SYSTEM_VC_API_KEY:-test123}
      SYSTEM_VC_ADAPTER_TYPE: ${SYSTEM_VC_ADAPTER_TYPE:-VCKIT}
      SYSTEM_VC_API_VERSION: ${SYSTEM_VC_API_VERSION:-1.0.0}
      SYSTEM_VC_SERVICE_NAME: ${SYSTEM_VC_SERVICE_NAME:-System Default VC}
      SYSTEM_VC_SERVICE_DESCRIPTION: ${SYSTEM_VC_SERVICE_DESCRIPTION:-System-wide default verifiable credential service instance}
      SYSTEM_STORAGE_BASE_URL: http://storage-service:3334
      SYSTEM_STORAGE_API_KEY: ${SYSTEM_STORAGE_API_KEY:-test123}
      SYSTEM_STORAGE_ADAPTER_TYPE: ${SYSTEM_STORAGE_ADAPTER_TYPE:-UNCEFACT_STORAGE}
      SYSTEM_STORAGE_API_VERSION: ${SYSTEM_STORAGE_API_VERSION:-4.0}
      SYSTEM_STORAGE_PUBLIC_BUCKET: ${SYSTEM_STORAGE_PUBLIC_BUCKET:-public-data}
      SYSTEM_STORAGE_PRIVATE_BUCKET: ${SYSTEM_STORAGE_PRIVATE_BUCKET:-private-data}
      SYSTEM_STORAGE_SERVICE_NAME: ${SYSTEM_STORAGE_SERVICE_NAME:-System Default Storage}
      SYSTEM_STORAGE_SERVICE_DESCRIPTION: ${SYSTEM_STORAGE_SERVICE_DESCRIPTION:-System-wide default storage service instance}
      SYSTEM_IDR_BASE_URL: http://identity-resolver-service:3000
      SYSTEM_IDR_API_KEY: ${SYSTEM_IDR_API_KEY:-test123}
      SYSTEM_IDR_ADAPTER_TYPE: ${SYSTEM_IDR_ADAPTER_TYPE:-PYX_IDR}
      SYSTEM_IDR_API_VERSION: ${SYSTEM_IDR_API_VERSION:-4.0}
      SYSTEM_IDR_DEFAULT_LINK_TYPE: ${SYSTEM_IDR_DEFAULT_LINK_TYPE:-untp:dpp}
      SYSTEM_IDR_DEFAULT_MIME_TYPE: ${SYSTEM_IDR_DEFAULT_MIME_TYPE:-text/html}
      SYSTEM_IDR_DEFAULT_LANGUAGE: ${SYSTEM_IDR_DEFAULT_LANGUAGE:-en}
      SYSTEM_IDR_DEFAULT_CONTEXT: ${SYSTEM_IDR_DEFAULT_CONTEXT:-au}
      SYSTEM_IDR_DEFAULT_FWQS: ${SYSTEM_IDR_DEFAULT_FWQS:-true}
      SYSTEM_IDR_SERVICE_NAME: ${SYSTEM_IDR_SERVICE_NAME:-System Default IDR}
      SYSTEM_IDR_SERVICE_DESCRIPTION: ${SYSTEM_IDR_SERVICE_DESCRIPTION:-System-wide default Identity Resolver service instance}
      SYSTEM_DID: ${SYSTEM_DID:-did:web:uncefact.github.io:project-vckit:test-and-development}
      SYSTEM_DID_NAME: ${SYSTEM_DID_NAME:-System Default DID}
      SYSTEM_DID_DESCRIPTION: ${SYSTEM_DID_DESCRIPTION:-System-wide default DID for the UNTP reference implementation}
      # OpenTelemetry - see docs/observability.md
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-agent:4317}
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-local}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:3003/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      keycloak:
        condition: service_started
      vckit-api:
        condition: service_healthy
      storage-service:
        condition: service_started
      ri-db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    ports:
      - 5432:5432
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=vckit
    volumes:
      - vckit-data:/var/lib/postgresql/data
    restart: always

  storage-service:
    image: ghcr.io/uncefact/project-storage-service:4.0.0
    ports:
      - 3334:3334
    environment:
      - PROTOCOL=http
      - DOMAIN=localhost
      - PORT=3334
      - AVAILABLE_BUCKETS=${UNCEFACT_STORAGE_PUBLIC_BUCKET:-public-data},${UNCEFACT_STORAGE_PRIVATE_BUCKET:-private-data}
      - DEFAULT_BUCKET=${UNCEFACT_STORAGE_PUBLIC_BUCKET:-public-data}
      - STORAGE_TYPE=local
      - API_KEY=${UNCEFACT_STORAGE_API_KEY:-test123}
      - ALLOWED_UPLOAD_TYPES=image/png,image/jpeg,image/webp,application/pdf,text/html
    volumes:
      - storage_service_data:/app/src/uploads

  identity-resolver-service:
    # Replace with local or deployed image
    image: ghcr.io/pyx-industries/pyx-identity-resolver:4.0.0
    ports:
      - '3000:3000'
    environment:
      - OBJECT_STORAGE_ENDPOINT=identity-resolver-service-object-store
      - OBJECT_STORAGE_PORT=9000
      - OBJECT_STORAGE_USE_SSL=false
      - OBJECT_STORAGE_ACCESS_KEY=minioadmin
      - OBJECT_STORAGE_SECRET_KEY=minioadmin
      - OBJECT_STORAGE_BUCKET_NAME=idr-bucket-1
      - OBJECT_STORAGE_PATH_STYLE=true
      - IDENTIFIER_PATH=identifiers
      - API_KEY=test123
      - APP_ENDPOINT=http://localhost:3000
      - APP_NAME=IDR-1
      - RESOLVER_DOMAIN=http://localhost:3000
      - PORT=3000
    depends_on:
      - identity-resolver-service-object-store

  identity-resolver-service-object-store:
    image: quay.io/minio/minio:RELEASE.2024-08-17T01-24-54Z-cpuv1
    command: server /data --console-address ":9090"
    ports:
      - '9000:9000'
      - '9090:9090'
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - ./minio_data/identity-resolver-service-object-store:/data

  # Observability stack - see docs/observability.md
  otel-agent:
    image: otel/opentelemetry-collector-contrib:0.111.0
    profiles: ['observability', 'local-observability']
    command: ['--config=/etc/otel-collector.yaml']
    volumes:
      - ./deploy/observability-local/otel-collector.yaml:/etc/otel-collector.yaml:ro
    ports:
      - '4317:4317'
      - '4318:4318'

  tempo:
    image: grafana/tempo:2.10.5
    profiles: ['local-observability']
    command: ['-config.file=/etc/tempo/tempo.yaml']
    volumes:
      - ./deploy/observability-local/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo

  grafana:
    image: grafana/grafana:11.3.0
    profiles: ['local-observability']
    ports:
      - '3030:3000'
    environment:
      GF_FEATURE_TOGGLES_ENABLE: 'traceqlEditor'
    volumes:
      - ./deploy/observability-local/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana

volumes:
  ri-db-data:
  vckit-data:
  storage_service_data:
  keycloak-data:
  tempo-data:
  grafana-data:
